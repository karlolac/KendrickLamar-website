<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kendrick Lamar - Kontakt</title>
    <link rel="stylesheet" href="..\Styles\style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="icon" href="../Images/favicon.png">
</head>
<body>

<header>
    <nav class="nav-container">
        <h1 class="kendrickTitle">KENDRICK LAMAR</h1>
        <ul class="nav-links">
            <li><a href="..\index.html">Početna</a></li>
            <li><a href="galerija.html">Galerija</a></li>
            <li><a href="albumi.html">Albumi</a></li>
            <li><a href="kontakt.html" class="active">Kontakt</a></li>
        </ul>
    </nav>
</header>

<main class="contact-section">
    <section class="contact-intro">
        <h2>Kontakt</h2>
        <p>Pošaljite nam poruku putem forme ispod.</p>
    </section>

    <section class="form-container">
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Ime i prezime:</label>
                <input type="text" id="name" name="name" placeholder="Vaše ime i prezime.." required>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Vaš e-mail.." required>
            </div>

            <div class="form-group">
                <label for="message">Poruka:</label>
                <textarea id="message" name="message" placeholder="Napišite nešto.." style="height:150px" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Pošalji</button>
        </form>
        <div id="formFeedback"></div>
    </section>
</main>

<footer>
    <p>&copy; Kendrick Lamar Fan Page <span id="year"></span></p>
</footer>

<script src="../Scripts/script.js"></script>

</body>
</html>
